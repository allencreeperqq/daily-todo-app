<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>節拍器</title>
<style>
  :root {
    color-scheme: dark;
  }
  body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', 'Microsoft JhengHei', system-ui, sans-serif;
    background: #16181d;
    color: #e8e9ec;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 24px;
    box-sizing: border-box;
    height: 100vh;
  }
  h1 {
    font-size: 0.9rem;
    margin: 0 0 20px;
    color: #9aa0ab;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .bpm-display {
    font-size: 3.2rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 2px;
    font-variant-numeric: tabular-nums;
  }
  .bpm-label {
    color: #9aa0ab;
    font-size: 0.75rem;
    margin-bottom: 22px;
  }
  input[type='range'] {
    width: 100%;
    margin-bottom: 22px;
  }
  .buttons {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  #playBtn {
    background: #818cf8;
    color: #14162b;
  }
  #tapBtn {
    background: #2c303a;
    color: #e8e9ec;
  }
  .beat-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #2c303a;
    margin: 20px auto 0;
    transition: background 0.05s, transform 0.05s;
  }
  .beat-dot.on {
    background: #818cf8;
    transform: scale(1.3);
  }
</style>
</head>
<body>
  <h1>節拍器</h1>
  <div class="bpm-display" id="bpmDisplay">120</div>
  <div class="bpm-label">BPM</div>
  <input type="range" id="bpmSlider" min="30" max="240" value="120" />
  <div class="buttons">
    <button id="playBtn">開始</button>
    <button id="tapBtn">Tap Tempo</button>
  </div>
  <div class="beat-dot" id="beatDot"></div>

  <script>
    const bpmDisplay = document.getElementById('bpmDisplay')
    const bpmSlider = document.getElementById('bpmSlider')
    const playBtn = document.getElementById('playBtn')
    const tapBtn = document.getElementById('tapBtn')
    const beatDot = document.getElementById('beatDot')

    let bpm = 120
    let audioCtx = null
    let nextNoteTime = 0
    let timerId = null
    let isPlaying = false
    let tapTimes = []

    function updateBpmDisplay() {
      bpmDisplay.textContent = bpm
    }

    bpmSlider.addEventListener('input', () => {
      bpm = Number(bpmSlider.value)
      updateBpmDisplay()
    })

    function playClick(time) {
      const osc = audioCtx.createOscillator()
      const gain = audioCtx.createGain()
      osc.frequency.value = 1000
      gain.gain.setValueAtTime(0.4, time)
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05)
      osc.connect(gain)
      gain.connect(audioCtx.destination)
      osc.start(time)
      osc.stop(time + 0.05)

      const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000)
      setTimeout(() => {
        beatDot.classList.add('on')
        setTimeout(() => beatDot.classList.remove('on'), 80)
      }, delayMs)
    }

    // Standard "look-ahead" scheduler: schedule audio events slightly ahead
    // of real time so playback stays sample-accurate despite setTimeout jitter.
    function scheduler() {
      while (nextNoteTime < audioCtx.currentTime + 0.1) {
        playClick(nextNoteTime)
        nextNoteTime += 60 / bpm
      }
      timerId = setTimeout(scheduler, 25)
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        clearTimeout(timerId)
        isPlaying = false
        playBtn.textContent = '開始'
        return
      }
      if (!audioCtx) audioCtx = new AudioContext()
      nextNoteTime = audioCtx.currentTime + 0.05
      isPlaying = true
      playBtn.textContent = '停止'
      scheduler()
    })

    tapBtn.addEventListener('click', () => {
      const now = performance.now()
      tapTimes.push(now)
      if (tapTimes.length > 5) tapTimes.shift()
      if (tapTimes.length >= 2) {
        const intervals = []
        for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i - 1])
        const avgMs = intervals.reduce((a, b) => a + b, 0) / intervals.length
        bpm = Math.min(240, Math.max(30, Math.round(60000 / avgMs)))
        bpmSlider.value = String(bpm)
        updateBpmDisplay()
      }
    })
  </script>
</body>
</html>
