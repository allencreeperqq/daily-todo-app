<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>音樂播放器</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', 'Microsoft JhengHei', system-ui, sans-serif;
    background: #16181d;
    color: #e8e9ec;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid #2c303a;
    flex-shrink: 0;
  }
  h1 {
    font-size: 0.9rem;
    margin: 0 0 10px;
    color: #9aa0ab;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .folder-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .folder-path {
    flex: 1;
    font-size: 0.78rem;
    color: #9aa0ab;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: rtl;
    text-align: left;
  }
  button {
    padding: 7px 10px;
    border-radius: 8px;
    border: none;
    background: #2c303a;
    color: #e8e9ec;
    font-size: 0.78rem;
    cursor: pointer;
    white-space: nowrap;
  }
  button.primary {
    background: #818cf8;
    color: #14162b;
    font-weight: 600;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #trackList {
    flex: 1;
    overflow-y: auto;
    list-style: none;
    margin: 0;
    padding: 6px 8px;
  }
  #trackList li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  #trackList li:hover {
    background: #1e212a;
  }
  #trackList li.playing {
    background: color-mix(in srgb, #818cf8 22%, transparent);
  }
  .track-info {
    flex: 1;
    min-width: 0;
  }
  .track-title {
    font-size: 0.85rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-sub {
    font-size: 0.72rem;
    color: #9aa0ab;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-badge {
    font-size: 0.68rem;
    color: #818cf8;
    border: 1px solid currentColor;
    border-radius: 4px;
    padding: 1px 5px;
    flex-shrink: 0;
  }
  .track-duration {
    font-size: 0.72rem;
    color: #9aa0ab;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .empty-hint {
    color: #666a76;
    font-size: 0.82rem;
    text-align: center;
    padding: 30px 10px;
  }
  #nowPlaying {
    border-top: 1px solid #2c303a;
    padding: 12px 16px 16px;
    flex-shrink: 0;
  }
  #npTitle {
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #npSub {
    font-size: 0.75rem;
    color: #9aa0ab;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  audio {
    width: 100%;
    height: 32px;
    margin-bottom: 8px;
  }
  .np-controls {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .np-controls button {
    flex: 1;
  }
  #metaGrid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 10px;
    font-size: 0.72rem;
    color: #9aa0ab;
  }
  #metaGrid span.k {
    color: #666a76;
  }
</style>
</head>
<body>
  <header>
    <h1>音樂播放器</h1>
    <div class="folder-row">
      <span class="folder-path" id="folderPath">尚未選擇資料夾</span>
      <button id="pickBtn" class="primary">選擇資料夾</button>
      <button id="rescanBtn" disabled>重新掃描</button>
    </div>
  </header>

  <ul id="trackList"></ul>

  <div id="nowPlaying" style="display:none">
    <div id="npTitle"></div>
    <div id="npSub"></div>
    <audio id="audio" controls></audio>
    <div class="np-controls">
      <button id="prevBtn">上一首</button>
      <button id="nextBtn">下一首</button>
      <button id="spotifyBtn">在 Spotify 搜尋</button>
    </div>
    <div id="metaGrid"></div>
  </div>

  <script>
    const folderPathEl = document.getElementById('folderPath')
    const pickBtn = document.getElementById('pickBtn')
    const rescanBtn = document.getElementById('rescanBtn')
    const trackListEl = document.getElementById('trackList')
    const nowPlayingEl = document.getElementById('nowPlaying')
    const npTitleEl = document.getElementById('npTitle')
    const npSubEl = document.getElementById('npSub')
    const metaGridEl = document.getElementById('metaGrid')
    const audioEl = document.getElementById('audio')
    const prevBtn = document.getElementById('prevBtn')
    const nextBtn = document.getElementById('nextBtn')
    const spotifyBtn = document.getElementById('spotifyBtn')

    let currentFolder = null
    let tracks = []
    let currentIndex = -1

    function formatDuration(seconds) {
      if (!seconds && seconds !== 0) return '--:--'
      const total = Math.round(seconds)
      const m = Math.floor(total / 60)
      const s = total % 60
      return `${m}:${String(s).padStart(2, '0')}`
    }

    function formatSampleRate(hz) {
      if (!hz) return null
      return hz % 1000 === 0 ? `${hz / 1000} kHz` : `${hz} Hz`
    }

    function renderTrackList() {
      trackListEl.innerHTML = ''
      if (tracks.length === 0) {
        const li = document.createElement('li')
        li.className = 'empty-hint'
        li.textContent = currentFolder ? '這個資料夾裡沒有找到 wav / flac 檔案' : '選一個資料夾開始'
        trackListEl.appendChild(li)
        return
      }
      tracks.forEach((track, index) => {
        const li = document.createElement('li')
        if (index === currentIndex) li.className = 'playing'
        li.innerHTML = `
          <div class="track-info">
            <div class="track-title"></div>
            <div class="track-sub"></div>
          </div>
          <span class="track-badge"></span>
          <span class="track-duration"></span>
        `
        li.querySelector('.track-title').textContent = track.title
        const joinedSub = [track.artist, track.album].filter(Boolean).join(' — ')
        li.querySelector('.track-sub').textContent =
          joinedSub || (track.parseError ? '無法解析標籤' : '')
        const badgeParts = [track.container]
        if (track.sampleRate) badgeParts.push(formatSampleRate(track.sampleRate))
        li.querySelector('.track-badge').textContent = badgeParts.join(' · ')
        li.querySelector('.track-duration').textContent = formatDuration(track.duration)
        li.addEventListener('click', () => playTrack(index))
        trackListEl.appendChild(li)
      })
    }

    function renderMeta(track) {
      const rows = [
        ['格式', track.container + (track.lossless === true ? ' (無損)' : track.lossless === false ? ' (有損)' : '')],
        ['取樣率', formatSampleRate(track.sampleRate) ?? '未知'],
        ['位元深度', track.bitsPerSample ? `${track.bitsPerSample}-bit` : '未知'],
        ['聲道數', track.channels ?? '未知'],
        ['專輯', track.album ?? '未知'],
        ['曲目', track.trackNo ?? '未知']
      ]
      metaGridEl.innerHTML = rows
        .map(([k, v]) => `<span class="k">${k}</span><span>${v}</span>`)
        .join('')
    }

    function playTrack(index) {
      const track = tracks[index]
      if (!track) return
      currentIndex = index
      audioEl.src = track.fileUrl
      audioEl.play().catch(() => {})
      npTitleEl.textContent = track.title
      npSubEl.textContent = [track.artist, track.album].filter(Boolean).join(' — ') || track.fileName
      renderMeta(track)
      nowPlayingEl.style.display = ''
      renderTrackList()
    }

    prevBtn.addEventListener('click', () => {
      if (tracks.length === 0) return
      playTrack((currentIndex - 1 + tracks.length) % tracks.length)
    })
    nextBtn.addEventListener('click', () => {
      if (tracks.length === 0) return
      playTrack((currentIndex + 1) % tracks.length)
    })
    audioEl.addEventListener('ended', () => {
      if (tracks.length === 0) return
      if (currentIndex + 1 < tracks.length) playTrack(currentIndex + 1)
    })
    spotifyBtn.addEventListener('click', () => {
      const track = tracks[currentIndex]
      if (!track) return
      const query = [track.artist, track.title].filter(Boolean).join(' ') || track.title
      window.plugin.invoke('openInSpotify', query)
    })

    async function loadFolder(folderPath) {
      currentFolder = folderPath
      folderPathEl.textContent = folderPath
      rescanBtn.disabled = false
      trackListEl.innerHTML = '<li class="empty-hint">掃描中...</li>'
      tracks = await window.plugin.invoke('scanFolder', folderPath)
      currentIndex = -1
      renderTrackList()
    }

    pickBtn.addEventListener('click', async () => {
      const folderPath = await window.plugin.invoke('pickFolder')
      if (folderPath) await loadFolder(folderPath)
    })
    rescanBtn.addEventListener('click', () => {
      if (currentFolder) loadFolder(currentFolder)
    })

    window.plugin.invoke('getLastFolder').then((folderPath) => {
      if (folderPath) loadFolder(folderPath)
    })
  </script>
</body>
</html>
